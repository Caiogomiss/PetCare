<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- maximum-scale=1 evita o zoom automático do iPhone ao tocar nos campos -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>PetCare</title>
    <meta name="description" content="Saúde e cuidados do seu pet em um só lugar: carteirinha de vacinas, lembretes, serviços e alertas." />
    <meta name="theme-color" content="#13A08F" />

    <!-- Instalar na tela inicial (iPhone e Android) -->
    <link rel="manifest" href="manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PetCare" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <meta property="og:title" content="PetCare" />
    <meta property="og:description" content="Saúde e cuidados do seu pet em um só lugar." />
    <meta property="og:image" content="icon-512.png" />

    <style id="expo-reset">
      html, body { height: 100%; background: #F7F9FC; }
      body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>Ative o JavaScript para usar o PetCare.</noscript>
    <div id="root"></div>

</html>
